# The system the data and messaging suites test, plus its observability.
#   npx pnpm stack:up     start it and wait until everything is healthy
#   npx pnpm test:data    run the suites from your machine against it
#   npx pnpm stack:test   one command: build, start, run the suites in a container, stop
#   npx pnpm stack:down   stop and delete the data
# Grafana: http://localhost:3000 (anonymous viewer). Prometheus: http://localhost:9090.
# Pushgateway (test metrics): http://localhost:9091; set AIQA_PUSHGATEWAY to it to send local runs.
# Keycloak (tokens for PUT /products): http://localhost:8180, admin / admin; realm in keycloak/.
name: aiqa-stack

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: aiqa, POSTGRES_PASSWORD: aiqa, POSTGRES_DB: shop }
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aiqa -d shop']
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 3s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    ports: ['9092:9092']
    environment:
      # One node in KRaft mode (no ZooKeeper). Containers use kafka:19092, your machine localhost:9092.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30

  # OAuth 2.0 / OpenID Connect for the product API: a local test realm with service clients only.
  # The issuer is fixed to http://localhost:8180 however a token is requested (from your machine or from
  # inside the network), so a token's `iss` always matches what the order service expects.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    volumes: ['./keycloak/aiqa-realm.json:/opt/keycloak/data/import/aiqa-realm.json:ro']
    ports: ['8180:8080']
    healthcheck:
      # The image has no curl: ask the management port for readiness with bash alone (/dev/tcp, read).
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  order-service:
    build: { context: ../.., dockerfile: apps/order-service/Dockerfile }
    environment:
      DATABASE_URL: postgres://aiqa:aiqa@postgres:5432/shop
      MONGO_URL: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:19092
      # Product writes need a token with the catalog-admin role. Keys come from inside the network.
      AUTH_ISSUER: http://localhost:8180/realms/aiqa
      AUTH_JWKS_URL: http://keycloak:8080/realms/aiqa/protocol/openid-connect/certs
    # Host port 8088, not 8080: Jenkins and many dev tools already listen on 8080.
    ports: ['8088:8080', '9464:9464']
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  prometheus:
    image: prom/prometheus:v3.16.0
    # The image's own two flags, plus the remote-write receiver: k6 pushes its metrics here.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes: ['../kubernetes/aiqa-stack/files/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']
    depends_on: [order-service]

  # Test runs push pass rates, durations and performance numbers here (AIQA_PUSHGATEWAY);
  # Prometheus scrapes it for Grafana's "Test runs" dashboard.
  pushgateway:
    image: prom/pushgateway:v1.11.4
    ports: ['9091:9091']

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
    volumes:
      - ../kubernetes/aiqa-stack/files/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../kubernetes/aiqa-stack/files/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [prometheus]

  # Only with --profile perf, through `pnpm perf:load [smoke|load|stress]` once the stack is up:
  # k6 places orders over HTTP, streams its metrics to Prometheus (Grafana: "Load tests" dashboard)
  # and writes its summary to packages/load-tests/results for the run history.
  k6:
    profiles: [perf]
    image: grafana/k6:2.4.0
    command: run --summary-export=/results/summary.json -o experimental-prometheus-rw /scripts/order-flow.js
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      PROFILE: smoke
      # setup() creates products, which needs a catalog-admin token.
      AUTH_TOKEN_URL: http://keycloak:8080/realms/aiqa/protocol/openid-connect/token
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
    # Root, so it can write the summary into a folder owned by whoever runs the tests.
    user: '0'
    volumes:
      - ../../packages/load-tests/scripts:/scripts:ro
      - ../../packages/load-tests/results:/results
    depends_on:
      order-service: { condition: service_healthy }
      prometheus: { condition: service_started }

  # Only with --profile test (pnpm stack:test): the data suites, run inside the compose network.
  data-tests:
    profiles: [test]
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile }
    command: pnpm test:data
    environment:
      CI: 'true'
      DATABASE_URL: postgres://aiqa:aiqa@postgres:5432/shop
      MONGO_URL: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:19092
      ORDER_SERVICE_URL: http://order-service:8080
      ORDER_METRICS_URL: http://order-service:9464/metrics
      AIQA_PUSHGATEWAY: http://pushgateway:9091
      AUTH_TOKEN_URL: http://keycloak:8080/realms/aiqa/protocol/openid-connect/token
    volumes:
      # Runs are added to your local history, so they appear on the dashboard (pnpm report:dashboard).
      - ../../.aiqa:/work/.aiqa
      - ../../packages/data-framework/playwright-report:/work/packages/data-framework/playwright-report
      - ../../packages/data-framework/test-results:/work/packages/data-framework/test-results
    depends_on:
      order-service: { condition: service_healthy }
