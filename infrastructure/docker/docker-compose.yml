# Run from the repository root:  docker compose -f infrastructure/docker/docker-compose.yml up --build tests
services:
  tests:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile }
    ipc: host # Chromium needs more shared memory than Docker gives by default
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ../../packages/playwright-framework/playwright-report:/work/packages/playwright-framework/playwright-report
      - ../../packages/playwright-framework/allure-results:/work/packages/playwright-framework/allure-results

  # Create or refresh the Linux visual baselines (the ones CI compares against):
  #   docker compose -f infrastructure/docker/docker-compose.yml run --rm snapshots
  snapshots:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile }
    ipc: host
    environment: { PW_VISUAL: '1' } # the image sets CI=true, which otherwise switches snapshots off
    command: pnpm --filter @aiqa/playwright-framework snapshots:update
    volumes:
      - ../../packages/playwright-framework/tests/visual:/work/packages/playwright-framework/tests/visual

  # The component gallery's visual baselines (packages/dashboard), made the same way:
  #   docker compose -f infrastructure/docker/docker-compose.yml run --rm dashboard-snapshots
  dashboard-snapshots:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile }
    ipc: host
    environment: { PW_VISUAL: '1' }
    command: pnpm --filter @aiqa/dashboard snapshots:update
    volumes:
      - ../../packages/dashboard/tests/components/__screenshots__:/work/packages/dashboard/tests/components/__screenshots__

  # Optional local model:  docker compose --profile ai up ollama
  ollama:
    image: ollama/ollama
    profiles: [ai]
    ports: ['11434:11434']
    volumes: ['ollama:/root/.ollama']

volumes:
  ollama:
