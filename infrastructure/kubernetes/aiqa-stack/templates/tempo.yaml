{{- if .Values.observability.traces }}
# Tempo: trace storage. The order service sends OpenTelemetry spans to it (OTLP over HTTP, port 4318).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |-
{{ .Files.Get "files/tempo/tempo.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app: tempo
    {{- include "aiqa.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tempo } }
  template:
    metadata:
      labels: { app: tempo }
      annotations: { checksum/config: {{ .Files.Get "files/tempo/tempo.yaml" | sha256sum }} }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: tempo
          image: {{ .Values.images.tempo }}
          args: ['-target=all', '-config.file=/etc/tempo/tempo.yaml']
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: tempo-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels: { app: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200 }
    - { name: otlp-http, port: 4318 }
    - { name: otlp-grpc, port: 4317 }
{{- end }}
