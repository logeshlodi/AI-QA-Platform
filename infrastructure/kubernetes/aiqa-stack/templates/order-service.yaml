# The service under test. Its image is built locally and loaded into kind (`pnpm k8s:up`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    {{- include "aiqa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      enableServiceLinks: false
      # The service exits when a dependency is missing at start-up; waiting here avoids a crash loop
      # with growing back-off while Kafka (the slowest) starts.
      initContainers:
        {{- include "aiqa.waitFor" (dict "name" "postgres" "image" .Values.images.busybox "host" "postgres" "port" 5432) | nindent 8 }}
        {{- include "aiqa.waitFor" (dict "name" "mongo" "image" .Values.images.busybox "host" "mongo" "port" 27017) | nindent 8 }}
        {{- include "aiqa.waitFor" (dict "name" "kafka" "image" .Values.images.busybox "host" "kafka" "port" 19092) | nindent 8 }}
        {{- include "aiqa.waitFor" (dict "name" "rabbitmq" "image" .Values.images.busybox "host" "rabbitmq" "port" 5672) | nindent 8 }}
      containers:
        - name: order-service
          image: {{ .Values.images.orderService }}
          imagePullPolicy: IfNotPresent
          env:
            {{- include "aiqa.stackEnv" . | nindent 12 }}
            - name: PARALLEL_PARTITIONS
              value: {{ .Values.orderService.parallelPartitions | quote }}
            {{- if .Values.observability.traces }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://tempo:4318' }
            - { name: OTEL_SERVICE_NAME, value: order-service }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9464 }
            - { name: grpc, containerPort: 50051 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  type: NodePort
  selector: { app: order-service }
  ports:
    - { name: http, port: 8080, nodePort: {{ .Values.nodePorts.orderService }} }
    - { name: metrics, port: 9464, nodePort: {{ .Values.nodePorts.orderMetrics }} }
    # Inside the cluster only: kind publishes node ports only when it creates the cluster.
    - { name: grpc, port: 50051, appProtocol: grpc }
