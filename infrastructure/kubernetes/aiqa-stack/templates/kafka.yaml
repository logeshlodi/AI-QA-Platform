# Kafka, one node in KRaft mode. Two client listeners: INTERNAL for pods (kafka:19092) and EXTERNAL
# for your machine (localhost:{{ .Values.nodePorts.kafka }}, through the node port kind publishes).
# A client is told to reconnect to the address its listener advertises, so each must be reachable
# from where that client runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "aiqa.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # A Service named "kafka" would give the pod KAFKA_* variables that the image reads as settings.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          env:
            - { name: KAFKA_NODE_ID, value: '1' }
            - { name: KAFKA_PROCESS_ROLES, value: 'broker,controller' }
            - { name: KAFKA_LISTENERS, value: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093' }
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'INTERNAL://kafka:19092,EXTERNAL://localhost:{{ .Values.nodePorts.kafka }}'
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093' }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1' }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0' }
            - { name: KAFKA_NUM_PARTITIONS, value: '3' }
          ports:
            - { name: internal, containerPort: 19092 }
            - { name: external, containerPort: 9092 }
          readinessProbe:
            exec:
              command: ['sh', '-c', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null']
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  selector: { app: kafka }
  ports:
    - { name: internal, port: 19092 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels: { app: kafka }
spec:
  type: NodePort
  selector: { app: kafka }
  ports:
    - { name: external, port: 9092, nodePort: {{ .Values.nodePorts.kafka }} }
