{{- if eq .Values.job.name "data" }}
# The Postgres, MongoDB and Kafka suites, from inside the cluster. Rendered by `pnpm k8s:test data`.
apiVersion: batch/v1
kind: Job
metadata:
  name: aiqa-data-{{ .Values.job.id }}
  labels:
    app: aiqa-tests
    suite: data
    {{- include "aiqa.labels" . | nindent 4 }}
spec:
  {{- include "aiqa.jobSpec" . | nindent 2 }}
  template:
    metadata: { labels: { app: aiqa-tests, suite: data } }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: tests
          image: {{ .Values.images.tests }}
          imagePullPolicy: IfNotPresent
          workingDir: /work
          command: ['pnpm', 'test:data']
          env:
            {{- include "aiqa.stackEnv" . | nindent 12 }}
            - { name: ORDER_SERVICE_URL, value: 'http://order-service:8080' }
            - { name: ORDER_METRICS_URL, value: 'http://order-service:9464/metrics' }
            - { name: ORDER_GRPC_ADDRESS, value: 'order-service:50051' }
            {{- include "aiqa.testEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: results, mountPath: /work/.aiqa }]
      volumes:
        {{- include "aiqa.resultsVolume" . | nindent 8 }}
{{- end }}
