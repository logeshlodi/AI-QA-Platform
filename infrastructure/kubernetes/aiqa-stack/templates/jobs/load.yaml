{{- if eq .Values.job.name "load" }}
# The k6 load test against the order service. Rendered by `pnpm k8s:test load [profile]`, which
# passes the script with --set-file and records the summary in the run history afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiqa-load-{{ .Values.job.id }}
  labels: { app: aiqa-tests, suite: load }
data:
  order-flow.js: |-
{{ required "set k6.script with --set-file" .Values.k6.script | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aiqa-load-{{ .Values.job.id }}
  labels:
    app: aiqa-tests
    suite: load
    {{- include "aiqa.labels" . | nindent 4 }}
spec:
  {{- include "aiqa.jobSpec" . | nindent 2 }}
  template:
    metadata: { labels: { app: aiqa-tests, suite: load } }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: k6
          image: {{ .Values.images.k6 }}
          # Root, to write the summary into the results folder.
          securityContext: { runAsUser: 0 }
          args:
            - run
            - --summary-export=/results/k8s/load-{{ .Values.job.id }}/summary.json
            - -o
            - opentelemetry
            - /scripts/order-flow.js
          env:
            - { name: ORDER_SERVICE_URL, value: 'http://order-service:8080' }
            {{- include "aiqa.tokenEnv" . | nindent 12 }}
            - { name: PROFILE, value: {{ .Values.job.profile | quote }} }
            # OpenTelemetry into Prometheus's OTLP receiver; trends arrive as histograms.
            - { name: K6_OTEL_EXPORTER_PROTOCOL, value: http/protobuf }
            - { name: K6_OTEL_HTTP_EXPORTER_ENDPOINT, value: 'prometheus:9090' }
            - { name: K6_OTEL_HTTP_EXPORTER_URL_PATH, value: /api/v1/otlp/v1/metrics }
            - { name: K6_OTEL_HTTP_EXPORTER_INSECURE, value: 'true' }
            - { name: K6_OTEL_METRIC_PREFIX, value: k6_ }
            - { name: K6_OTEL_EXPORT_INTERVAL, value: 5s }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: results, mountPath: /results }
      initContainers:
        # k6 does not create the folder for --summary-export.
        - name: results-folder
          image: {{ .Values.images.busybox }}
          command: ['mkdir', '-p', '/results/k8s/load-{{ .Values.job.id }}']
          volumeMounts: [{ name: results, mountPath: /results }]
      volumes:
        - { name: scripts, configMap: { name: aiqa-load-{{ .Values.job.id }} } }
        {{- include "aiqa.resultsVolume" . | nindent 8 }}
{{- end }}
