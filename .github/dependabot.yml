# Dependabot keeps the pinned versions in pnpm-workspace.yaml (the catalog) and the Actions up to date.
# Updates are grouped so a week brings two or three pull requests, not twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: build }
    ignore:
      # typescript-eslint supports TypeScript up to 6.0 (7.0 has no programmatic API yet):
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the Node version the project runs on (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # pnpm 12's native linker fails with "Access is denied" creating links on the Windows dev laptop,
      # where pnpm 10 works. Revisit with Windows Developer Mode on (see docs/STATUS.md).
      - dependency-name: pnpm
        update-types: ['version-update:semver-major']
    groups:
      playwright:
        patterns: ['@playwright/*', 'playwright*', 'allure*', '@axe-core/playwright']
      quality-tools:
        patterns: ['eslint*', 'typescript*', 'prettier', 'vitest', 'husky', 'lint-staged', '@commitlint/*']
      everything-else:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ['*']

# The Playwright Docker image is left out on purpose: its tag must equal the @playwright/test version,
# so bump the Dockerfile and the `visual` job in ci.yml by hand together with the npm package.
