name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '30 1 * * *' }] # nightly, 07:00 IST
  workflow_dispatch:

concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }

# Read-only by default; nothing in CI writes to the repository.
permissions: { contents: read }

jobs:
  quality:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm exec prettier --check .
      # Warns when a Playwright Docker image tag lags @playwright/test (Dependabot cannot bump both).
      - run: node scripts/check-playwright-image.mjs

  security:
    name: Security (licences, dependency audit, OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every dependency's licence against the open-source allow-list (scripts/check-licences.mjs).
      - run: pnpm security:licences
      # Known advisories at high or critical; the two moderate ones are explained in osv-scanner.toml.
      - run: pnpm security:audit
      # The lockfile against the OSV database; ignored findings carry a reason and an expiry date.
      - run: pnpm security:osv

  api:
    name: API specs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # History survives between CI runs in the Actions cache: restore the newest, save a new one.
      - uses: actions/cache@v6
        with:
          path: .aiqa/history
          key: aiqa-history-api-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aiqa-history-api-${{ github.ref_name }}-
            aiqa-history-api-main-
      - run: pnpm test:api
      - name: Summary
        if: always()
        continue-on-error: true # a reporting glitch must never fail the tests' job
        run: |
          { echo '### API runs'; echo '```'; pnpm -s aiqa history --suite api --limit 5; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: api-report, path: packages/api-framework/playwright-report, retention-days: 14 }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: api-dashboard, path: .aiqa/dashboard, retention-days: 30 }

  data:
    name: Postgres, MongoDB and Kafka suites
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .aiqa/history
          key: aiqa-history-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aiqa-history-data-${{ github.ref_name }}-
            aiqa-history-data-main-
      # One command: build the order service, start Postgres, MongoDB, Kafka, run the suites in a container.
      - run: pnpm stack:test
      - name: Order service logs
        if: failure()
        run: docker compose -f infrastructure/docker/stack.compose.yml logs order-service
      - if: always()
        run: pnpm stack:down
      # The test container runs as root, so what it wrote (history, reports) is root-owned.
      - name: Give the test output back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .aiqa packages/data-framework 2>/dev/null || true
      - name: Summary
        if: always()
        continue-on-error: true # a reporting glitch must never fail the tests' job
        run: |
          { echo '### Data suite runs'; echo '```'; pnpm -s aiqa history --suite data --limit 5; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: data-report, path: packages/data-framework/playwright-report, retention-days: 14 }

  contracts:
    name: Contracts (Pact consumer and provider)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The storefront's HTTP contract is replayed against the real service; the notifications
      # contract is checked against the service's own event builders.
      - run: pnpm stack:up
      - run: pnpm test:contract
        env: { PACT_DO_NOT_TRACK: 'true' }
      - name: Order service logs
        if: failure()
        run: docker compose -f infrastructure/docker/stack.compose.yml logs order-service
      - if: always()
        run: pnpm stack:down
      # No Pact Broker here: the contracts travel as an artifact, to read or to verify elsewhere.
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: pacts, path: packages/contract-tests/pacts, retention-days: 30 }

  dast:
    name: ZAP API scan of the order service (authenticated)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Our own service only: ZAP attacks every operation in its OpenAPI document, with a Keycloak token.
      - run: pnpm stack:up
      - run: pnpm security:zap
      - if: always()
        run: pnpm stack:down
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: zap-report, path: .aiqa/zap, retention-days: 14 }

  branded:
    name: Smoke in real ${{ matrix.channel }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { channel: [chrome, msedge] }
    steps:
      - uses: actions/checkout@v7
      # chromium as well: the setup and login projects that run before the smoke specs use the bundled browser.
      - uses: ./.github/actions/setup
        with: { browsers: 'chromium ${{ matrix.channel }}' }
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --project=${{ matrix.channel }}
        env: { PW_BRANDED_BROWSERS: '${{ matrix.channel }}' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          {
            name: 'branded-${{ matrix.channel }}-results',
            path: packages/playwright-framework/test-results,
            retention-days: 7,
          }

  lighthouse:
    name: Lighthouse audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --project=lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: lighthouse-report,
            path: packages/playwright-framework/lighthouse-report,
            retention-days: 14,
          }

  perf:
    name: Browser performance (Web Vitals, page weight, memory)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      - uses: actions/cache@v6
        with:
          path: .aiqa/history
          key: aiqa-history-perf-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aiqa-history-perf-${{ github.ref_name }}-
            aiqa-history-perf-main-
      # One test at a time, Chromium only (DevTools throttling and heap readings).
      - run: pnpm test:perf
      - name: Summary
        if: always()
        continue-on-error: true # a reporting glitch must never fail the tests' job
        run: |
          { echo '### Performance metrics against their usual level'; echo '```'; pnpm -s aiqa perf --all; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: perf-report, path: packages/playwright-framework/playwright-report, retention-days: 14 }

  load:
    name: Load test (k6 smoke against the order service)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .aiqa/history
          key: aiqa-history-load-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aiqa-history-load-${{ github.ref_name }}-
            aiqa-history-load-main-
      - run: pnpm stack:up
      # 2 orders a second for 30 seconds: is everything wired up, and do the thresholds hold?
      # The heavier `load` and `stress` profiles are for a machine you control: pnpm perf:load load.
      - run: pnpm perf:load smoke
      - name: Order service logs
        if: failure()
        run: docker compose -f infrastructure/docker/stack.compose.yml logs order-service
      - if: always()
        run: pnpm stack:down
      - name: Summary
        if: always()
        continue-on-error: true
        run: |
          { echo '### Load test metrics against their usual level'; echo '```'; pnpm -s aiqa perf --all; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: k6-summary, path: packages/load-tests/results, retention-days: 14 }

  visual:
    name: Visual comparison (Linux baselines)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image that created the baselines (docker compose ... run --rm snapshots), so fonts and
    # rendering match. If @playwright/test is newer than the tag, the setup step adds the matching
    # browser, so a Playwright update does not break this job; bump the tag when the quality job warns.
    container: { image: 'mcr.microsoft.com/playwright:v1.65.1-noble', options: --ipc=host }
    env: { PW_VISUAL: '1', HOME: /root }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium, system-deps: 'false' }
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test tests/visual --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: visual-diff, path: packages/playwright-framework/test-results, retention-days: 7 }

  components:
    name: Component tests (stories, axe, visual)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image the visual baselines were made in, as for the UI suite's visual job.
    container: { image: 'mcr.microsoft.com/playwright:v1.65.1-noble', options: --ipc=host }
    env: { PW_VISUAL: '1', HOME: /root }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium, system-deps: 'false' }
      - run: pnpm --filter @aiqa/dashboard test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: components-report, path: packages/dashboard/playwright-report, retention-days: 7 }

  web:
    name: Web app (Keycloak sign-in, end to end, accessibility)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      # Only Keycloak is needed: the app reads a fixed fixture data set, not the other services.
      - run: docker compose -f infrastructure/docker/stack.compose.yml up -d --wait keycloak
      - run: pnpm --filter @aiqa/web test
      - name: Keycloak logs
        if: failure()
        run: docker compose -f infrastructure/docker/stack.compose.yml logs keycloak
      - if: always()
        run: docker compose -f infrastructure/docker/stack.compose.yml down -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: web-report, path: apps/web/playwright-report, retention-days: 7 }

  labs:
    name: Lab solutions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      # Only the solutions: every exercise fails on purpose.
      - run: pnpm test:labs
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: labs-report, path: packages/examples/playwright-report, retention-days: 7 }

  ui:
    name: UI specs (shard ${{ matrix.shard }}/3)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { browsers: chromium firefox webkit }
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --shard=${{ matrix.shard }}/3 --grep-invert @audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: 'blob-report-${{ matrix.shard }}',
            path: packages/playwright-framework/blob-report,
            retention-days: 3,
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: 'allure-results-${{ matrix.shard }}',
            path: packages/playwright-framework/allure-results,
            retention-days: 3,
          }

  report:
    name: Merge shard reports
    if: always()
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with: { path: all-blob-reports, pattern: blob-report-*, merge-multiple: true }
      - uses: actions/cache@v6
        with:
          path: .aiqa/history
          key: aiqa-history-ui-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aiqa-history-ui-${{ github.ref_name }}-
            aiqa-history-ui-main-
      # merge.config.ts adds the history reporter, so the three shards are recorded as one run.
      - run: pnpm --filter @aiqa/playwright-framework exec playwright merge-reports --config merge.config.ts ../../all-blob-reports
      - name: Summary
        if: always()
        continue-on-error: true # a reporting glitch must never fail the tests' job
        run: |
          {
            echo '### UI runs'; echo '```'; pnpm -s aiqa history --suite ui --limit 5; echo '```'
            echo '### Flaky tests'; echo '```'; pnpm -s aiqa flaky; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          { name: ui-html-report, path: packages/playwright-framework/playwright-report, retention-days: 14 }
      - uses: actions/upload-artifact@v7
        with: { name: ui-dashboard, path: .aiqa/dashboard, retention-days: 30 }
