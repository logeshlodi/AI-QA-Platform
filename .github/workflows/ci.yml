name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '30 1 * * *' }] # nightly, 07:00 IST
  workflow_dispatch:

concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }

jobs:
  quality:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  api:
    name: API specs
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: api-report, path: packages/api-framework/playwright-report, retention-days: 14 }

  branded:
    name: Smoke in real ${{ matrix.channel }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { channel: [chrome, msedge] }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiqa/playwright-framework exec playwright install --with-deps ${{ matrix.channel }}
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --project=${{ matrix.channel }}
        env: { PW_BRANDED_BROWSERS: '${{ matrix.channel }}' }

  lighthouse:
    name: Lighthouse audit
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiqa/playwright-framework exec playwright install --with-deps chromium
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --project=lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: lighthouse-report,
            path: packages/playwright-framework/lighthouse-report,
            retention-days: 14,
          }

  visual:
    name: Visual comparison (Linux baselines)
    needs: quality
    runs-on: ubuntu-latest
    # Same image that created the baselines (docker compose ... run --rm snapshots), so rendering matches.
    container: { image: 'mcr.microsoft.com/playwright:v1.65.0-noble', options: --ipc=host }
    env: { PW_VISUAL: '1', HOME: /root }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test tests/visual --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: visual-diff, path: packages/playwright-framework/test-results, retention-days: 7 }

  ui:
    name: UI specs (shard ${{ matrix.shard }}/3)
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiqa/playwright-framework exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @aiqa/playwright-framework exec playwright test --shard=${{ matrix.shard }}/3 --grep-invert @audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: 'blob-report-${{ matrix.shard }}',
            path: packages/playwright-framework/blob-report,
            retention-days: 3,
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          {
            name: 'allure-results-${{ matrix.shard }}',
            path: packages/playwright-framework/allure-results,
            retention-days: 3,
          }

  report:
    name: Merge shard reports
    if: always()
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { path: all-blob-reports, pattern: blob-report-*, merge-multiple: true }
      - run: pnpm --filter @aiqa/playwright-framework exec playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          { name: ui-html-report, path: packages/playwright-framework/playwright-report, retention-days: 14 }
