# Merges a Dependabot pull request once CI has passed on it, for patch and minor updates only.
# Off until you opt in: Settings > Secrets and variables > Actions > Variables > New repository
# variable DEPENDABOT_AUTOMERGE = true. Majors always wait for a person.
#
# It reacts to the finished CI run (workflow_run), so it never merges before the checks are done,
# with or without branch protection. Note: a merge made with the workflow token does not start a
# new CI run on main; the nightly run covers main.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: { contents: write, pull-requests: write }

jobs:
  merge:
    if: >-
      vars.DEPENDABOT_AUTOMERGE == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge if the update is a patch or minor and nothing changed since CI ran
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,headRefOid,author \
                 --jq '.[0] | select(.author.login == "app/dependabot")')
          if [ -z "$pr" ]; then echo "No open Dependabot pull request for this branch."; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "PR #$number has new commits since this CI run; the next run decides."; exit 0
          fi
          # Dependabot writes the update type of every dependency into its commit message.
          message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
          if grep -q 'update-type: version-update:semver-major' <<<"$message"; then
            echo "::notice::PR #$number contains a major update; leaving it for review."; exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch
          echo "::notice::Merged PR #$number (patch/minor, CI green)."
